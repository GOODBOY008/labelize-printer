[package]
name = "labelize-printer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
labelize-printer-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = "=0.5.0"
gpui-component-assets = "=0.5.0"
open = "5"
log = "0.4"
tempfile.workspace = true

async-channel = "2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
