[package]
name = "labelize-printer-updater"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
labelize-printer-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
fs2.workspace = true
libc.workspace = true
semver = "1"
sha2 = "0.10"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
open = "5"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
