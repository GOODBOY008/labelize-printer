[workspace]
members = ["crates/core", "crates/daemon", "crates/desktop"]
default-members = ["crates/core", "crates/daemon"]
exclude = ["vendor/labelize", "vendor/xattr", "vendor/gpui"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "pnm"] }
lopdf = "0.46"
flate2 = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
directories = "6"
interprocess = "=2.4.7"
fs2 = "0.4"
libc = "0.2"
tempfile = "3"
labelize-printer-core = { path = "crates/core" }

[profile.release]
lto = "thin"
strip = "debuginfo"

[patch.crates-io]
xattr = { path = "vendor/xattr" }
gpui = { path = "vendor/gpui" }
